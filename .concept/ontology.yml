canonical_terms:
  Interpreter:
    id: "TERM-INTERPRETER"
    layer: "core"
    status: "stable"
    definition: "会話フローとエージェント相互作用を管理する中核コンポーネント"
    synonyms: ["GuiAgentInterpreter", "会話インタープリタ"]
    boundaries:
      includes: ["状態管理", "セッション管理", "メッセージルーティング"]
      excludes: ["UI描画", "LLM直接実行"]
    lifecycle: ["STATE_INIT", "STATE_RUNNING", "STATE_STOP"]
    related_terms: ["Agent", "Session", "Message", "State"]
    assumptions: []
    evidence:
      - source: "gui_agent_loop_core/core/interpreter_manager.py"
        quote: "class InterpreterManager: Manages chat sessions and state handling"

  Agent:
    id: "TERM-AGENT"
    layer: "core"
    status: "stable"
    definition: "特定の役割と実装タイプを持つ専門化AIエンティティ"
    synonyms: ["AIエージェント", "専門エージェント", "AgentType", "AgentDefinition", "TaskAgent", "AgentImage"]
    boundaries:
      includes: ["役割定義", "タスク実行", "LLM呼び出し", "実装タイプ（TOOL_CALLING/STRUCTURED_CHAT）", "アイコンマッピング"]
      excludes: ["セッション管理", "UI描画"]
    lifecycle: []
    related_terms: ["Interpreter", "AgentName", "Message", "Backend"]
    assumptions:
      - id: "ASM-AGENT-001"
        text: "AUTO: Agentはロールベースで分類される"
        decision_key: "AUTO:Agent.role:classification"
        expires_after_runs: 20
      - id: "ASM-AGENT-002"
        text: "AUTO: AgentTypeは実装タイプ別プロパティ（AgentNameの役割とは独立）"
        decision_key: "AUTO:Agent.type:implementation_property"
        expires_after_runs: 20
    evidence:
      - source: "gui_agent_loop_core/schema/core/schema.py"
        quote: "class AgentName(str, Enum): AGENT_EXECUTOR, LLM_PLANNER, SUPERVISOR, THOUGHT, CREW"
      - source: "gui_agent_loop_core/schema/agent/schema.py"
        quote: "class AgentType(str, enum.Enum): TOOL_CALLING, STRUCTURED_CHAT"
      - source: "gui_agent_loop_core/backend/server_impl_common.py"
        quote: "get_agent_image_path(agent_name): agent_image_filename mapping based on AgentName"

  Session:
    id: "TERM-SESSION"
    layer: "core"
    status: "stable"
    definition: "一意のIDで管理される会話コンテキスト（JWT認証使用）"
    synonyms: ["ChatSession", "会話セッション", "JWT"]
    boundaries:
      includes: ["メッセージ履歴", "セッションID（UUID）", "JWTトークン（HS256アルゴリズム）"]
      excludes: ["UI状態", "インタープリタ状態"]
    lifecycle: ["created", "active", "terminated"]
    related_terms: ["Interpreter", "Message", "Agent"]
    assumptions:
      - id: "ASM-SESSION-001"
        text: "AUTO: JWTはHS256アルゴリズム使用（暫定）"
        decision_key: "AUTO:Session.jwt:algorithm_hs256"
        expires_after_runs: 20
    evidence:
      - source: "gui_agent_loop_core/core/interpreter_manager.py"
        quote: "ChatSession: Individual conversation session with message history; jwt.encode(session_id, self.secret_key, algorithm='HS256')"

  Message:
    id: "TERM-MESSAGE"
    layer: "core"
    status: "stable"
    definition: "ユーザー、システム、エージェント間の構造化された通信単位（TOOL/FUNCTION役割含む）"
    synonyms: ["メッセージ", "ChatMessage"]
    boundaries:
      includes: ["コンテンツ", "役割（USER/SYSTEM/ASSISTANT/COMPUTER/TOOL/FUNCTION）", "タイプ", "メタデータ", "最大長制限（MAX_MESSAGE_LENGTH=100）"]
      excludes: ["セッション状態", "UIイベント"]
    lifecycle: ["created", "processed", "streamed"]
    related_terms: ["Interpreter", "Agent", "Session"]
    assumptions:
      - id: "ASM-MSG-001"
        text: "AUTO: メッセージは再帰的にフラット化可能"
        decision_key: "AUTO:Message.structure:flat"
        expires_after_runs: 20
      - id: "ASM-MSG-002"
        text: "AUTO: MAX_MESSAGE_LENGTH=100はハードリミット"
        decision_key: "AUTO:Message.limit:100"
        expires_after_runs: 20
      - id: "ASM-MSG-003"
        text: "AUTO: TOOLとFUNCTIONは異なるセマンティクスを持つ（暫定）"
        decision_key: "AUTO:Message.roles:tool_function_separation"
        expires_after_runs: 20
    evidence:
      - source: "gui_agent_loop_core/schema/message/schema.py"
        quote: "MessageTypeEnum: MESSAGE, CODE, CONFIRMATION, CONSOLE, IMAGE, FUNCTION; MessageRoleEnum: USER, SYSTEM, ASSISTANT, COMPUTER, TOOL, FUNCTION"
      - source: "gui_agent_loop_core/backend/server_impl_gradio.py"
        quote: "MAX_MESSAGE_LENGTH = 100"

  State:
    id: "TERM-STATE"
    layer: "core"
    status: "stable"
    definition: "インタープリタの実行状態を表す列挙型"
    synonyms: ["InterpreterState", "インタープリタ状態"]
    boundaries:
      includes: ["状態遷移", "状態チェック", "状態変更イベント", "タイマーベースの定期更新（3秒間隔）"]
      excludes: ["セッションライフサイクル", "UI状態"]
    lifecycle: ["STATE_INIT", "STATE_RUNNING", "STATE_STOP"]
    related_terms: ["Interpreter", "AutoChat", "Timer"]
    assumptions:
      - id: "ASM-STATE-001"
        text: "AUTO: 状態は単調遷移する（INIT → RUNNING → STOP）"
        decision_key: "AUTO:State.lifecycle:monotonic"
        expires_after_runs: 20
      - id: "ASM-STATE-002"
        text: "AUTO: ユーザー入力時（textbox.submit）に自動的にRUNNINGに遷移"
        decision_key: "AUTO:State.transition:auto_on_input"
        expires_after_runs: 20
    evidence:
      - source: "gui_agent_loop_core/schema/core/schema.py"
        quote: "class InterpreterState(str, Enum): STATE_INIT, STATE_RUNNING, STATE_STOP"
      - source: "gui_agent_loop_core/backend/server_impl_gradio.py"
        quote: "t3.tick(interpreter_manager.update_state_view, outputs=[agent_state])"
      - source: "gui_agent_loop_core/backend/server_impl_gradio.py"
        quote: "chat_iface.textbox.submit(fn=interpreter_manager.change_state_running, outputs=[agent_state])"

  AutoChat:
