      excludes: ["手動チャット", "UIイベントハンドリング"]
    lifecycle: ["triggered", "executed", "completed"]
    related_terms: ["Interpreter", "State", "Message"]
    assumptions:
      - id: "ASM-AUTO-001"
        text: "AUTO: AutoChatはSTATE_STOP時のみ発火"
        decision_key: "AUTO:AutoChat.trigger:stop_only"
        expires_after_runs: 20
    evidence:
      - source: "gui_agent_loop_core/core/interpreter_manager.py"
        quote: "auto_chat(): Only triggers when state is STATE_STOP"

