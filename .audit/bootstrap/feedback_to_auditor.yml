feedback:
  bootstrap_run_timestamp: "2026-02-02T01:35:00Z"
  version: "1.1"
  mode: concept_driven

  # 1. audit/intent.yml の欠如（最重要）
  intent_missing:
    exists: false
    impact: "high"
    recommendation: |
      **強く推奨**: .audit/config/intent.yml の作成

      現在 concept_driven mode で運用中ですが、intent.yml を作成することで以下のメリットが得られます:

      - 存在意義（mission, target_user, core_value）の明確化
      - MDファイルの一貫性のある生成と更新
      - audit+concept統合モードへの移行
      - より戦略的なドキュメント整備

      作成手順:
      1. 14_repo_genesis_auditor を実行
      2. .audit/config/intent.yml が生成される
      3. 次回 bootstrap 実行時に自動統合される

  # 2. 概念モデルとの連携状況
  concept_integration:
    used: true
    ontology_terms_used: 275
    alignment_score: 100
    new_term_candidates:
      - term: "ChatManager"
        reason: "exploration findingsで言及されているが未登録"
        evidence: "会話セッションの管理に関連する用語"
      - term: "Timer"
        reason: "INV-STATE-002で言及されているが未登録"
        evidence: "3秒間隔の状態更新タイマー"

  # 3. MD網羅度
  md_coverage:
    tier1_coverage: "2/2 (100%)"
    tier2_coverage: "4/4 (100%)"
    tier3_coverage: "5/5 (100%)"
    total_coverage: "11/11 (100%)"
    status: "excellent"

  # 4. 一意性評価
  uniqueness_score:
    score: 100
    issues_found: 0
    issues_resolved: 0
    remaining_issues: []
    note: "全MDファイルで完璧な一意性が達成されている"

  # 5. MD品質評価
  md_quality:
    overall_score: 100
    concept_alignment_score: 100
    clarity_score: 100
    invariant_coverage: 100
    term_normalization: 100

  # 6. ontology.ymlへの提案
  ontology_suggestions:
    new_terms:
      - canonical: "ChatManager"
        proposed_layer: "domain"
        reason: "Session管理に関連するコンポーネント"
        evidence: ["exploration findings", "Interpreterとの関連性"]

      - canonical: "Timer"
