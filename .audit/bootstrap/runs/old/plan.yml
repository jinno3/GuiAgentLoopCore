      status: "stable"
    - canonical: "Backend"
      definition: "GUIフレームワーク実装（Gradio等）"
      layer: "domain"
      status: "stable"
    - canonical: "Converter"
      definition: "データ構造変換・辞書フラット化・コードフォーマット抽出を行うユーティリティ"
      layer: "aux"
