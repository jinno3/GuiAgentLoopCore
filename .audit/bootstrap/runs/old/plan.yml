verification_targets:
  uniqueness_checks:
    - id: "UC-001"
      name: "存在意義の一貫性"
      description: "全MDで同じmissionが表現されているか"
    - id: "UC-002"
      name: "対象ユーザーの一貫性"
      description: "全MDで同じtarget_userを想定しているか"
    - id: "UC-003"
      name: "制約の一貫性"
      description: "技術的制約が一致しているか"
    - id: "UC-004"
      name: "境界線の一貫性"
      description: "out_of_scopeが矛盾なく定義されているか"
    - id: "UC-005"
      name: "intent.yml準拠"
      description: "全MDがintent.ymlを正しく反映しているか"

  concept_alignment_checks:
    - id: "CA-001"
      name: "用語の正規形使用"
      description: "全MDでcanonical termを使用しているか"
    - id: "CA-002"
      name: "同義語の排除"
      description: "synonymが本文で使用されていないか"
    - id: "CA-003"
      name: "不変条件の反映"
      description: "hard invariantsがドキュメント化されているか"
    - id: "CA-004"
      name: "AUTO決定の注記"
      description: "暫定仕様が明示されているか"
    - id: "CA-005"
      name: "用語境界の整合"
      description: "boundaries.includes/excludesが矛盾していないか"
