validation_criteria:
  - id: "UC-001"
    name: "存在意義の一貫性"
    check: "全MDで同じmissionが表現されているか"
    source: ".audit/intent.yml"
  - id: "UC-002"
    name: "対象ユーザーの一貫性"
    check: "全MDで同じtarget_userを想定しているか"
    source: ".audit/intent.yml"
  - id: "UC-003"
    name: "制約の一貫性"
    check: "技術的制約が一致しているか"
    source: ".audit/constraints.yml + .concept/invariants.yml"
  - id: "UC-004"
    name: "境界線の一貫性"
    check: "out_of_scopeが矛盾なく定義されているか"
    source: ".audit/intent.yml"
  - id: "UC-005"
    name: "intent.yml準拠"
    check: "全MDがintent.ymlを正しく反映しているか"
    source: ".audit/intent.yml"
  - id: "CA-001"
    name: "用語の正規形使用"
    check: "全MDでcanonical termを使用しているか"
    source: ".concept/ontology.yml"
  - id: "CA-002"
    name: "同義語の排除"
    check: "synonymが本文で使用されていないか"
    source: ".concept/ontology.yml"
  - id: "CA-003"
    name: "不変条件の反映"
    check: "hard invariantsがドキュメント化されているか"
    source: ".concept/invariants.yml"
  - id: "CA-004"
    name: "AUTO決定の注記"
    check: "暫定仕様が明示されているか"
    source: ".concept/ambiguities.yml"
  - id: "CA-005"
    name: "用語境界の整合"
    check: "boundaries.includes/excludesが矛盾していないか"
    source: ".concept/ontology.yml"

