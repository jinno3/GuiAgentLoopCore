run_timestamp: "2026-02-02T00:00:00Z"
version: "1.1"

rotation:
  deleted_old: true
  moved_current_to_old: true

input_sources:
  audit:
    intent_yml: ".audit/config/intent.yml"
    constraints_yml: ".audit/config/constraints.yml"
  concept:
    ontology_yml: ".concept/ontology.yml"
    invariants_yml: ".concept/invariants.yml"
    has_concept: true

mode: "audit_and_concept"  # Full integration mode

intent_summary:
  mission: "GuiAgentLoopCore provides the core logic for bridging GUI frameworks and LLM agents, managing conversation flow, agent interactions, and state control."
  target_user:
    - "Application Developers: Building LLM-powered applications with GUI interfaces"
    - "AI Agent Developers: Creating specialized agents for specific tasks"
    - "Framework Developers: Building new GUI backend implementations"
    - "AI Agents: Claude, Gemini, Codex, and other AI models"
  core_value: "Reliable, type-safe, and extensible foundation for GUI-LLM integration with predictable state management and clear component boundaries"
  core_functions_count: 5
  boundaries_defined: true

ontology_summary:
  total_terms: 10
  core_terms: 5
  domain_terms: 4
  aux_terms: 1
  key_terms:
    - canonical: "Interpreter"
      definition: "会話フローとエージェント相互作用を管理する中核コンポーネント"
      layer: "core"
    - canonical: "Agent"
      definition: "特定の役割と実装タイプを持つ専門化AIエンティティ"
      layer: "core"
    - canonical: "Session"
      definition: "一意のIDで管理される会話コンテキスト"
      layer: "core"
    - canonical: "Message"
      definition: "ユーザー、システム、エージェント間の構造化された通信単位"
      layer: "core"
    - canonical: "State"
      definition: "インタープリタの実行状態を表す列挙型"
      layer: "core"

term_normalization:
  # From ontology.yml - map synonyms to canonical forms
  "GuiAgentInterpreter": "Interpreter"
  "会話インタープリタ": "Interpreter"
  "AIエージェント": "Agent"
  "専門エージェント": "Agent"
  "AgentType": "Agent"
  "AgentDefinition": "Agent"
  "TaskAgent": "Agent"
  "AgentImage": "Agent"
  "ChatSession": "Session"
  "会話セッション": "Session"
  "メッセージ": "Message"
  "ChatMessage": "Message"
  "InterpreterState": "State"
  "インタープリタ状態": "State"
  "自動チャット": "AutoChat"
  "自動継続": "AutoChat"
  "GuiAgentStreamWrapper": "StreamWrapper"
  "ストリームラッパー": "StreamWrapper"
  "GUIバックエンド": "Backend"
  "UIバックエンド": "Backend"
  "UIフレームワーク": "Backend"
  "会話メモリ": "Memory"
  "ConversationBuffer": "Memory"
  "変換器": "Converter"
  "マッパー": "Converter"

existing_mds:
  # Tier 1 (Required)
  - path: "README.md"
    status: "exists_good"
    tier: 1
    issues: []
  - path: "AGENTS.md"
    status: "exists_good"
    tier: 1
    issues: []

  # Tier 2 (Recommended)
  - path: "CLAUDE.md"
    status: "exists_good"
    tier: 2
    issues: []
  - path: "SYSTEM_CONSTITUTION.md"
    status: "exists_good"
    tier: 2
    issues: []
  - path: "PURPOSE.md"
    status: "exists_good"
    tier: 2
    issues: []
  - path: "CONTRIBUTING.md"
    status: "exists_good"
    tier: 2
    issues: []

  # Tier 3 (Optional)
  - path: "GEMINI.md"
    status: "exists_good"
    tier: 3
    issues: []
  - path: "CODEX.md"
    status: "exists_good"
    tier: 3
    issues: []
  - path: "ARCHITECTURE.md"
    status: "exists_good"
    tier: 3
    issues: []
  - path: "GLOSSARY.md"
    status: "exists_good"
    tier: 3
    issues: []

actions:
  # Main action: Verify and ensure intent.yml is reflected in docs
  - action: "verify"
    target: "all"
    reason: "Verify all MD files are aligned with intent.yml and ontology.yml"
    details:
      - "Check README.md reflects mission statement"
      - "Check AGENTS.md reflects target users and core values"
      - "Verify all terms use canonical forms from ontology.yml"
      - "Verify invariants are consistently documented"

  # Update GLOSSARY.md timestamp and ensure it's current
  - action: "update_metadata"
    target: "GLOSSARY.md"
    reason: "Update timestamp and ontology version reference"
    condition: "ontology_exists"

expected_outcomes:
  clarity_score_target: 100
  uniqueness_score_target: 100
  concept_alignment_target: 100
  md_coverage_target: "11/11 (100%)"
