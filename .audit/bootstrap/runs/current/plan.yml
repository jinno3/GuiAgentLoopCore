intent_summary:
  mission: "GuiAgentLoopCore provides the core logic for bridging GUI frameworks and LLM agents, managing conversation flow, agent interactions, and state control."

  target_users:
    - "Application Developers: Building LLM-powered applications with GUI interfaces"
    - "AI Agent Developers: Creating specialized agents for specific tasks"
    - "Framework Developers: Building new GUI backend implementations"
    - "AI Agents: Claude, Gemini, Codex, and other AI models working with this codebase"

  core_value: "Reliable, type-safe, and extensible foundation for GUI-LLM integration with predictable state management and clear component boundaries."

  core_functions:
    - "Centralized Conversation Management: Interpreter component centralizes conversation flow, state management, and agent coordination"
    - "State Machine with Monotonic Transitions: Enforce monotonic state transitions (INIT → RUNNING → STOP) through hard invariants"
    - "Multi-Agent Coordination: Role-based agent system (AGENT_EXECUTOR, LLM_PLANNER, SUPERVISOR, etc.) with clear boundaries"
    - "Structured Message Processing: Handle structured communication between users, systems, and agents"
    - "Backend Abstraction: Enable multiple GUI framework implementations (Gradio, extensible to others)"

  boundaries:
    in_scope:
      - "Conversation Flow Management"
      - "State Machine"
      - "Agent Coordination"
      - "Message Processing"
      - "Backend Abstraction"
      - "Streaming Support"

    out_of_scope:
      - "UI Rendering"
      - "LLM Execution"
      - "Session Storage"
      - "Authentication"
      - "Network Protocols"

