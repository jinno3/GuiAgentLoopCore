run_timestamp: "2026-02-01T22:09:00Z"
version: "1.1"

rotation:
  deleted_old: false
  moved_current_to_old: false

# Critical: .audit directory does not exist
input_sources:
  audit:
    intent_yml: null
    constraints_yml: null
    status: "MISSING"
    error: ".audit/config/intent.yml not found - 14_repo_genesis_auditor must be run first"
  concept:
    ontology_yml: ".concept/ontology.yml"
    invariants_yml: ".concept/invariants.yml"
    ambiguities_yml: ".concept/ambiguities.yml"
    has_concept: true

# Extracted from ontology.yml
ontology_summary:
  version: "0.3"
  updated_at: "2026-02-01T13:05:48Z"
  total_terms: 9
  by_layer:
    core: 5  # Interpreter, Agent, Session, Message, State
    domain: 3  # AutoChat, StreamWrapper, Backend, Memory
    aux: 1  # Converter
  by_status:
    stable: 8
    draft: 1  # Memory
  with_auto_decisions: 4  # Agent, State, AutoChat, Backend, Memory

key_terms_for_md:
  - canonical: "Interpreter"
    layer: "core"
    definition: "会話フローとエージェント相互作用を管理する中核コンポーネント"
    synonyms: ["GuiAgentInterpreter", "会話インタープリタ"]
    should_use_in: ["README.md", "AGENTS.md", "ARCHITECTURE.md"]

  - canonical: "Agent"
    layer: "core"
    definition: "特定の役割と実装タイプを持つ専門化AIエンティティ"
    synonyms: ["AIエージェント", "専門エージェント"]
    auto_decision: "AUTO: Agentはロールベースで分類される"
    should_use_in: ["README.md", "AGENTS.md", "GLOSSARY.md"]

  - canonical: "Session"
    layer: "core"
    definition: "一意のIDで管理される会話コンテキスト"
    synonyms: ["ChatSession", "会話セッション"]
    should_use_in: ["README.md", "ARCHITECTURE.md"]

  - canonical: "Message"
    layer: "core"
    definition: "ユーザー、システム、エージェント間の構造化された通信単位"
    synonyms: ["メッセージ", "ChatMessage"]
    auto_decision: "AUTO: メッセージは再帰的にフラット化可能"
    should_use_in: ["README.md", "ARCHITECTURE.md"]

  - canonical: "State"
    layer: "core"
    definition: "インタープリタの実行状態を表す列挙型"
    synonyms: ["InterpreterState", "インタープリタ状態"]
    auto_decision: "AUTO: 状態は単調遷移する（INIT → RUNNING → STOP）"
    should_use_in: ["README.md", "AGENTS.md"]

term_normalization:
  "GuiAgentInterpreter": "Interpreter"
  "会話インタープリタ": "Interpreter"
  "AIエージェント": "Agent"
  "専門エージェント": "Agent"
  "ChatSession": "Session"
  "会話セッション": "Session"
  "メッセージ": "Message"
  "ChatMessage": "Message"
  "InterpreterState": "State"
  "インタープリタ状態": "State"

invariants_summary:
  total: 7
  hard: 5  # INV-STATE-001, INV-SESSION-001, INV-MSG-001, INV-AUTO-001, INV-STREAM-001
  soft: 2  # INV-AGENT-001, INV-MEM-001
  stable: 6
  draft: 1  # INV-MEM-001

hard_invariants_to_document:
  - id: "INV-STATE-001"
    statement: "インタープリタ状態は単調遷移する：STATE_INIT → STATE_RUNNING → STATE_STOP"
    target_files: ["AGENTS.md", "CONTRIBUTING.md"]

  - id: "INV-MSG-001"
    statement: "メッセージタイプは定義された列挙型のみ：MESSAGE, CODE, CONFIRMATION, CONSOLE, IMAGE, FUNCTION"
    target_files: ["AGENTS.md", "CONTRIBUTING.md"]

  - id: "INV-AUTO-001"
    statement: "AutoChatはSTATE_STOP時のみトリガーされる"
    target_files: ["AGENTS.md"]

  - id: "INV-STREAM-001"
    statement: "ストリームラッパーは同期・非同期の両方をサポートする"
    target_files: ["ARCHITECTURE.md"]

auto_decisions_to_note:
  - id: "AUTO:Agent.role:classification"
    text: "Agentはロールベースで分類される"
    expires_after_runs: 20

  - id: "AUTO:Agent.type:implementation_property"
    text: "AgentTypeはAgentの実装タイプ別プロパティ（AgentNameの役割とは独立）"
    expires_after_runs: 20

  - id: "AUTO:State.lifecycle:monotonic"
    text: "状態は単調遷移する（INIT → RUNNING → STOP）"
    expires_after_runs: 20

  - id: "AUTO:AutoChat.trigger:stop_only"
    text: "AutoChatはSTATE_STOP時のみ発火"
    expires_after_runs: 20

  - id: "AUTO:Backend.primary:gradio"
    text: "Gradioが主要バックエンド（暫定）"
    expires_after_runs: 20

existing_mds:
  - path: "README.md"
    status: "exists_needs_update"
    issues:
      - "存在意義(.audit/intent.yml)が不在の為、プロジェクトのミッションが不明確"
      - "用語が正規形で使用されていない可能性"
      - " ontology.ymlの9コア用語が反映されていない"
      - "不変条件が記載されていない"

  - path: "CONTRIBUTING.md"
    status: "exists_needs_update"
    issues:
      - "不変条件(hard invariants)への言及がない"
      - "用語規約が定義されていない"

  - path: "docs/api.md"
    status: "exists"
    issues: []

  - path: "docs/usage.md"
    status: "exists"
    issues: []

actions:
  # Critical Issues First
  - action: "create"
    target: ".audit/config/intent.yml"
    reason: "存在意義定義が欠落 - 14_repo_genesis_auditorの実行が必要"
    priority: "CRITICAL"
    blocker: true

  # Tier 1: Required MDs
  - action: "create"
    target: "AGENTS.md"
    reason: "AIエージェント向け指示がない（Tier 1必須）"
    priority: "HIGH"
    should_include:
      - "用語規約セクション（正規形の使用）"
      - "不変条件（hard invariants）"
      - "AUTO決定の注記"
      - "行動規範"

  - action: "update"
    target: "README.md"
    reason: "ontology.ymlの用語を反映し、概念整合度を向上"
    priority: "HIGH"
    should_include:
      - "プロジェクトの明確な存在意義（要作成）"
      - "コア用語の定義"
      - "アーキテクチャ概要"

  # Tier 2: Recommended MDs
  - action: "create"
    target: "GLOSSARY.md"
    reason: "ontology.ymlから用語集を生成（concept integration）"
    priority: "MEDIUM"
    condition: "ontology_exists"

  - action: "create"
    target: "PURPOSE.md"
    reason: "目的の詳細説明（存在意義の深堀り）"
    priority: "MEDIUM"
    depends_on: ".audit/config/intent.yml"

  - action: "create"
    target: "CLAUDE.md"
    reason: "Claude向け特化指示"
    priority: "MEDIUM"

  - action: "update"
    target: "CONTRIBUTING.md"
    reason: "不変条件と用語規約を追加"
    priority: "MEDIUM"
    should_include:
      - "hard invariantsの遵守事項"
      - "用語の正規形使用ガイドライン"

  # Tier 3: Optional MDs
  - action: "create"
    target: "ARCHITECTURE.md"
    reason: "アーキテクチャ説明（mappings.ymlの反映）"
    priority: "LOW"

fallback_strategy:
  # .auditがない場合の暫定対応
  mode: "concept_driven"
  approach: |
    .audit/config/intent.ymlが存在しないため、以下の暫定対応を実行：

    1. .concept/ontology.ymlからプロジェクトの目的を推論：
       - Core: Interpreter, Agent, Session, Message, State
       - ドメイン: GUIとLLMエージェントのブリッジ

    2. README.mdには既存の内容を維持しつつ、用語の正規化を実施

    3. AGENTS.mdには、用語規約と不変条件を中心に記載

    4. feedback_to_auditor.ymlには、.auditの作成を強く推奨

  limitations:
    - "存在意義の一意性検証不可"
    - "mission/target_user/core_valueの定義不可"
    - "out_of_scopeの明確化不可"

  recommendations:
    - "14_repo_genesis_auditorを最優先で実行"
    - "audit/config/intent.yml作成後に再実行"
