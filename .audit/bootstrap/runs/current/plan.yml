intent_summary:
  mission: "GuiAgentLoopCore provides the core logic for bridging GUI frameworks and LLM agents, managing conversation flow, agent interactions, and state control."
  target_user:
    - "Application Developers"
    - "AI Agent Developers"
    - "Framework Developers"
    - "AI Agents"
  core_value: "Reliable, type-safe, and extensible foundation for GUI-LLM integration with predictable state management and clear component boundaries."
  core_functions:
    - "Centralized Conversation Management"
    - "State Machine with Monotonic Transitions"
    - "Multi-Agent Coordination"
    - "Structured Message Processing"
    - "Backend Abstraction"
    - "Streaming Support"
  boundaries:
    in_scope:
      - "Conversation Flow Management"
      - "State Machine"
      - "Agent Coordination"
      - "Message Processing"
      - "Backend Abstraction"
      - "Streaming Support"
    out_of_scope:
      - "UI Rendering"
      - "LLM Execution"
      - "Session Storage"
      - "Authentication"
      - "Network Protocols"

ontology_summary:
  total_terms: 11
  core_terms: 5
  domain_terms: 5
  aux_terms: 1
  key_terms:
    - canonical: "Interpreter"
      layer: "core"
      definition: "会話フローとエージェント相互作用を管理する中核コンポーネント"
      synonyms: ["GuiAgentInterpreter", "会話インタープリタ"]
    - canonical: "Agent"
      layer: "core"
      definition: "特定の役割と実装タイプを持つ専門化AIエンティティ"
      synonyms: ["AIエージェント", "専門エージェント", "AgentType", "AgentDefinition", "TaskAgent", "AgentImage"]
    - canonical: "Session"
      layer: "core"
      definition: "一意のIDで管理される会話コンテキスト（JWT認証使用）"
      synonyms: ["ChatSession", "会話セッション", "JWT"]
    - canonical: "Message"
      layer: "core"
      definition: "ユーザー、システム、エージェント間の構造化された通信単位"
      synonyms: ["メッセージ", "ChatMessage"]
    - canonical: "State"
      layer: "core"
      definition: "インタープリタの実行状態を表す列挙型"
      synonyms: ["InterpreterState", "インタープリタ状態"]
    - canonical: "AutoChat"
      layer: "domain"
      definition: "STATE_STOP時に自動的に会話を継続する機能"
      synonyms: ["自動チャット", "自動継続"]
    - canonical: "StreamWrapper"
      layer: "domain"
      definition: "同期・非同期ストリーミング応答を統一的に扱うユーティリティ"
      synonyms: ["GuiAgentStreamWrapper", "ストリームラッパー"]
    - canonical: "Backend"
      layer: "domain"
      definition: "GUIフレームワーク実装（Gradio等）"
      synonyms: ["GUIバックエンド", "UIフレームワーク", "GuiBackend", "GuiComponent"]
    - canonical: "Converter"
      layer: "aux"
      definition: "データ構造変換・辞書フラット化・コードフォーマット抽出を行うユーティリティ"
      synonyms: ["変換器", "マッパー"]
    - canonical: "Memory"
      layer: "domain"
      definition: "会話履歴を保持するバッファ機構"
      synonyms: ["会話メモリ", "ConversationBuffer"]
      status: "draft"
    - canonical: "Connector"
      layer: "domain"
      definition: "中核インタープリタと異なるエージェント実装をブリッジする実装固有のアダプタ"
      synonyms: ["コネクタ", "GuiAgentInterpreterABC", "ConnectorImplCodeinterpreterApi", "ConnectorImplOpenInterpreter", "OpenGuiConnector"]

